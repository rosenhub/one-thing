<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#010409"/>
  <text x="600" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#e6edf3">"I've avoided calling the doctor for weeks. Phones make me freeze."</text>
  <text x="600" y="76" text-anchor="middle" font-size="17" font-style="italic" fill="#c9d1d9">An autistic adult with ADHD. It has been six weeks.</text>
  <text x="600" y="99" text-anchor="middle" font-size="13" fill="#6e7681">Same model. Same question. The only difference is one skill file.</text>

  <rect x="40" y="118" width="545" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="64" y="148" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b949e">BEFORE</text>
  <text x="560" y="148" text-anchor="end" font-size="13" fill="#f85149">74 words · 9 steps</text>
  <rect x="64" y="166" width="497" height="376" rx="10" fill="#161b22" stroke="#30363d"/>
  <g fill="#e6edf3">
    <text x="84" y="196" font-size="15">That's so understandable, and phone anxiety is really</text>
    <text x="84" y="218" font-size="15">common! Here's a plan:</text>
    <text x="84" y="240" font-size="15">1. Find the number.</text>
    <text x="84" y="262" font-size="15">2. Check your calendar for good times.</text>
    <text x="84" y="284" font-size="15">3. Write a script of what you'll say.</text>
    <text x="84" y="306" font-size="15">4. Get your insurance card ready.</text>
    <text x="84" y="328" font-size="15">5. Practice the script out loud.</text>
    <text x="84" y="350" font-size="15">6. Pick a quiet time to call.</text>
    <text x="84" y="372" font-size="15">7. Make the call.</text>
    <text x="84" y="394" font-size="15">8. Write down the appointment.</text>
    <text x="84" y="416" font-size="15">9. Reward yourself!</text>
    <text x="84" y="438" font-size="15">You can also check if they have online booking. You've</text>
    <text x="84" y="460" font-size="15">got this!</text>
  </g>
  <text x="84" y="524" font-size="12" fill="#f85149">✗ 9 steps  ✗ "write a script" is a whole job  ✗ "you've got this"</text>

  <rect x="615" y="118" width="545" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="639" y="148" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b949e">AFTER · one-thing</text>
  <text x="1135" y="148" text-anchor="end" font-size="13" fill="#3fb950">20 words · 1 step, no phone yet</text>
  <rect x="639" y="166" width="497" height="376" rx="10" fill="#161b22" stroke="#30363d"/>
  <g fill="#e6edf3">
    <text x="659" y="202" font-size="22" font-weight="700">Find the doctor's phone number</text>
    <text x="659" y="238" font-size="22" font-weight="700">and write it on a piece of paper.</text>
    <text x="659" y="280" font-size="15">That's it. Say "done" when it's written.</text>
    <text x="659" y="310" font-size="13" fill="#6e7681">(next, you get the exact words to say. one thing at a time.)</text>
  </g>
  <text x="659" y="524" font-size="12" fill="#3fb950">✓ one action  ✓ under 2 minutes  ✓ no call yet  ✓ no pep talk</text>
</svg>
