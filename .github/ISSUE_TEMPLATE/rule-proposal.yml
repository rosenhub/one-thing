name: Rule proposal
description: Propose a new rule or a change to one of the 12
labels: [rule]
body:
  - type: textarea
    id: before
    attributes:
      label: Before
      description: A real response you got from an agent. Paste it exactly.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: After
      description: What it should have said instead.
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who does this help, in one sentence?
    validations:
      required: true
  - type: dropdown
    id: which
    attributes:
      label: Which rule does this change?
      options: ["1 One action per message", "2 Under 5 minutes", "3 Verb + object", "4 Physical and specific", "5 Hold the rest silently", "6 Done/next reveals the next one", "7 Never make the user choose", "8 Never number ahead", "9 Whole plan: 5 steps max", "10 No motivational language", "11 No you've got this", "12 Stall: smaller step", "New rule (say which one it replaces)"]
    validations:
      required: true
